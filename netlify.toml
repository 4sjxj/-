[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Supabase URL and anon/publishable keys are public by design and are
  # intentionally bundled into the client by Vite (VITE_ prefix).
  # Never put a service_role / sb_secret_ key in these variables.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_PUBLISHABLE_KEY"
